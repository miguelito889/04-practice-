name: My first yml file
on: [push]
jobs:
  script-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
      - run: npm ci
      - name: Run the lint, test and build script
        run: |
          npm run lint && npm run test && npm run build


